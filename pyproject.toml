[project]
name = "aegis-hgx"
version = "0.1.0"
description = "Research-grade graph machine learning platform for explainable cyber anomaly detection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mlflow>=3.0,<4.0",
]

[project.optional-dependencies]
ml = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "boto3",
]

serving = [
    "fastapi",
    "uvicorn[standard]",
    "httpx2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]