name: CI

on:
  push:
  pull_request:


jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: |
          pip install -e ".[ml,serving]"
          pip install pytest

      - name: Generate synthetic data
        run: python pipelines/generate_synthetic_events.py --config configs/data_generation.yaml

      - name: Train synthetic baseline model
        run: python -m aegis_hgx.models.baselines.train_logistic_baseline --config configs/baseline_logistic.yaml

      - name: Prepare CIC fixture data
        run: |
          mkdir -p data/external/cicids2017
          cp tests/fixtures/cicids2017/ci_cic_fixture.csv data/external/cicids2017/ci_cic_fixture.csv

      - name: Ingest CIC fixture data
        run: python pipelines/ingest_cic_sample.py --input-dir data/external/cicids2017 --max-rows 10000

      - name: Build CIC tabular features
        run: python pipelines/build_tabular_features.py

      - name: Train CIC logistic model
        run: python -m aegis_hgx.models.baselines.train_logistic_cic --config configs/logistic_cic.yaml

      - name: Train CIC XGBoost model
        run: python -m aegis_hgx.models.baselines.train_xgboost_cic --config configs/xgboost_cic.yaml

      - name: Train CIC MLP model
        run: python -m aegis_hgx.models.baselines.train_mlp_cic --config configs/mlp_cic.yaml

      - name: Train CIC PyTorch MLP diagnostic model
        run: python -m aegis_hgx.models.baselines.train_torch_mlp_cic --config configs/torch_mlp_cic.yaml

      - name: Run CIC calibration report
        run: python -m aegis_hgx.evaluation.torch_mlp_calibration_cic_report --config configs/torch_mlp_calibration_cic.yaml

      - name: Run CIC PyTorch MLP seed stability experiment
        run: python -m aegis_hgx.experiments.run_torch_mlp_multiseed_runs_cic --config configs/torch_mlp_multiseed_runs_cic.yaml

      - name: Build CIC baseline comparison report
        run: python -m aegis_hgx.reports.build_baseline_comparison_report --config configs/baseline_comparison_report.yaml

      - name: Test LANL ingestion pipeline
        run: python -m pytest tests/test_ingest_lanl_sample.py -ra

      - name: Test LANL event table builder
        run: python -m pytest tests/test_build_lanl_event_tables.py -ra

      - name: Run tests
        run: python -m pytest -ra