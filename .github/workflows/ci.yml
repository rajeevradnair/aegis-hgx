name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: |
          pip install -e ".[ml,serving]"
          pip install pytest

      - name: Generate synthetic data
        run: python pipelines/generate_synthetic_events.py --config configs/data_generation.yaml

      - name: Train baseline model
        run: python -m aegis_hgx.models.baselines.train_logistic_baseline --config configs/baseline_logistic.yaml

      - name: Run tests
        run: python -m pytest -ra