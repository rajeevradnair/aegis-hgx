input:
  directory: data/processed/lanl
  graph_nodes_filename: graph_nodes.parquet
  graph_edges_filename: graph_edges.parquet

output:
  directory: reports
  markdown_report_filename: lanl_graph_profile.md
  json_report_filename: lanl_graph_profile.json
  top_nodes_filename: lanl_top_nodes.csv

inspection:
